<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Drum Kit</title>
    <link rel="icon" href="https://fav.farm/🥁" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        color: white;
        font-size: 3rem;
        margin-bottom: 2rem;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
      }

      .keys {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
        padding: 2rem;
        max-width: 1000px;
      }

      .key {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        text-align: center;
        min-width: 100px;
        cursor: pointer;
        transition: all 0.07s ease;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        user-select: none;
      }

      .key:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        background: rgba(255, 255, 255, 0.2);
      }

      .key kbd {
        display: block;
        font-size: 2.5rem;
        color: white;
        font-weight: bold;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      }

      .key .sound {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
        letter-spacing: 1px;
      }

      .key.playing {
        transform: scale(1.1);
        border-color: #ffc600;
        background: rgba(255, 198, 0, 0.3);
        box-shadow: 0 0 30px rgba(255, 198, 0, 0.6);
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2rem;
        }
        .key {
          min-width: 80px;
          padding: 1rem;
        }
        .key kbd {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>🥁 JS Drum Kit</h1>
    <div class="keys">
      <div data-key="a" class="key">
        <kbd>A</kbd>
        <span class="sound">clap</span>
      </div>
      <div data-key="s" class="key">
        <kbd>S</kbd>
        <span class="sound">hihat</span>
      </div>
      <div data-key="d" class="key">
        <kbd>D</kbd>
        <span class="sound">kick</span>
      </div>
      <div data-key="f" class="key">
        <kbd>F</kbd>
        <span class="sound">openhat</span>
      </div>
      <div data-key="g" class="key">
        <kbd>G</kbd>
        <span class="sound">boom</span>
      </div>
      <div data-key="h" class="key">
        <kbd>H</kbd>
        <span class="sound">ride</span>
      </div>
      <div data-key="j" class="key">
        <kbd>J</kbd>
        <span class="sound">snare</span>
      </div>
      <div data-key="k" class="key">
        <kbd>K</kbd>
        <span class="sound">tom</span>
      </div>
      <div data-key="l" class="key">
        <kbd>L</kbd>
        <span class="sound">tink</span>
      </div>
    </div>

    <audio data-key="a" src="sounds/clap.wav"></audio>
    <audio data-key="s" src="sounds/hihat.wav"></audio>
    <audio data-key="d" src="sounds/kick.wav"></audio>
    <audio data-key="f" src="sounds/openhat.wav"></audio>
    <audio data-key="g" src="sounds/boom.wav"></audio>
    <audio data-key="h" src="sounds/ride.wav"></audio>
    <audio data-key="j" src="sounds/snare.wav"></audio>
    <audio data-key="k" src="sounds/tom.wav"></audio>
    <audio data-key="l" src="sounds/tink.wav"></audio>

    <script>
      function playSound(key) {
        const keyElement = document.querySelector(`div[data-key="${key}"]`);
        const audio = document.querySelector(`audio[data-key="${key}"]`);

        if (!keyElement || !audio) return;

        // Add visual effect
        keyElement.classList.add("playing");

        // Play sound from beginning
        audio.currentTime = 0;
        audio.play().catch((err) => console.log("Audio play failed:", err));
      }

      // Play sound on keypress
      window.addEventListener("keydown", (e) => {
        const keyPressed = e.key.toLowerCase();
        playSound(keyPressed);
      });

      // Allow clicking on keys
      document.querySelectorAll(".key").forEach((keyElement) => {
        keyElement.addEventListener("click", () => {
          const keyValue = keyElement.dataset.key;
          playSound(keyValue);
        });
      });

      // Remove visual effect after transition
      document.querySelectorAll(".key").forEach((keyElement) => {
        keyElement.addEventListener("transitionend", (e) => {
          if (e.propertyName === "transform") {
            keyElement.classList.remove("playing");
          }
        });
      });
    </script>
  </body>
</html>
